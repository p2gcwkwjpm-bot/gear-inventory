<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GearTrack AI - Music Equipment Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="glass sticky top-0 z-50 px-4 py-3 mb-6 shadow-lg flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fa-solid me-2 fa-guitar text-indigo-400 text-xl"></i>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">GearTrack AI</h1>
    </div>
    <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white p-2 text-lg">
      <i class="fa-solid fa-gear"></i>
    </button>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- Camera / Scanner Viewport -->
    <section class="glass rounded-2xl p-4 shadow-xl">
      <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
        <i class="fa-solid fa-camera text-indigo-400"></i> AI Gear Scanner
      </h2>

      <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-slate-700">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover hidden"></video>
        <canvas id="canvas" class="hidden"></canvas>

        <div id="cameraPlaceholder" class="text-center p-6 text-slate-400">
          <i class="fa-solid fa-camera-retro text-4xl mb-2 text-indigo-400"></i>
          <p class="text-sm">Start camera and point at gear or logo</p>
        </div>

        <div id="scanOverlay" class="hidden absolute inset-0 border-2 border-indigo-500 border-dashed m-6 rounded-lg pointer-events-none flex items-center justify-center">
          <span class="bg-indigo-600/80 text-white text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">Align Gear or Brand Logo</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="startCamBtn" onclick="startCamera()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-power-off"></i> Start Camera
        </button>
        <button id="snapBtn" onclick="captureAndIdentify()" disabled class="flex-1 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white py-2.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Identify Gear
        </button>
      </div>

      <div id="statusMessage" class="hidden mt-3 text-sm text-center p-2 rounded-lg bg-indigo-950/80 border border-indigo-800 text-indigo-200"></div>
    </section>

    <!-- Stats & Filters -->
    <section class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <div class="glass p-3 rounded-xl">
        <span class="text-xs text-slate-400">Total Gear</span>
        <p id="totalCount" class="text-xl font-bold text-indigo-400">0</p>
      </div>
      <div class="glass p-3 rounded-xl">
        <span class="text-xs text-slate-400">Est. Value</span>
        <p id="totalValue" class="text-xl font-bold text-emerald-400">$0</p>
      </div>
      <div class="glass col-span-2 md:col-span-1 p-3 rounded-xl flex items-center justify-between">
        <button onclick="exportCSV()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg text-sm border border-slate-600 flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-csv text-emerald-400"></i> Export CSV
        </button>
      </div>
    </section>

    <!-- Inventory List -->
    <section class="glass rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-indigo-400"></i> Inventory List
        </h2>
        <button onclick="openManualAddModal()" class="text-sm bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-lg">
          + Manual Add
        </button>
      </div>

      <div id="inventoryContainer" class="space-y-3">
        <!-- Dynamic Cards inserted here -->
      </div>
    </section>

  </main>

  <!-- Settings Modal (API Key) -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass bg-slate-900 rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-700">
      <h3 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-key"></i> Gemini API Settings
      </h3>
      <p class="text-xs text-slate-300">Enter your Google Gemini API Key to enable visual recognition. Key is stored locally in your browser.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
      <div class="flex justify-end gap-2">
        <button onclick="toggleSettingsModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
        <button onclick="saveApiKey()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-500">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    let stream = null;
    let inventory = JSON.parse(localStorage.getItem('gear_inventory') || '[]');

    document.addEventListener('DOMContentLoaded', () => {
      renderInventory();
      checkApiKey();
    });

    function checkApiKey() {
      const key = localStorage.getItem('gemini_api_key');
      if (!key) {
        showStatus('Please set your Gemini API key in Settings (top right).', 'warning');
      }
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settingsModal');
      const input = document.getElementById('apiKeyInput');
      input.value = localStorage.getItem('gemini_api_key') || '';
      modal.classList.toggle('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', key);
      toggleSettingsModal();
      showStatus('API Key saved!', 'success');
    }

    async function startCamera() {
      const video = document.getElementById('webcam');
      const placeholder = document.getElementById('cameraPlaceholder');
      const overlay = document.getElementById('scanOverlay');
      const snapBtn = document.getElementById('snapBtn');

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        video.srcObject = stream;
        video.classList.remove('hidden');
        placeholder.classList.add('hidden');
        overlay.classList.remove('hidden');
        snapBtn.disabled = false;
        showStatus('Camera ready.', 'success');
      } catch (err) {
        showStatus('Camera access failed: ' + err.message, 'error');
      }
    }

    async function captureAndIdentify() {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        toggleSettingsModal();
        return;
      }

      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // High-resolution full canvas frame capture
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      showStatus('Scanning gear with Gemini 2.5 Flash AI...', 'info');

      const prompt = `You are an expert musical equipment appraiser and gear historian.
Examine this photo carefully.
1. Read any visible brand logos, model names, text on labels, microcontrollers, or control knobs (OCR).
2. Identify the specific type of music gear (e.g., Synthesizer, Tube Amplifier, Electric Guitar, Solenoid/Microcontroller, Audio Interface).
3. Return ONLY a valid JSON object in this exact structure without markdown backticks:
{
  "name": "Brand Model Type (e.g., Fender Stratocaster, Arduino Uno R3)",
  "category": "Guitars / Amps / Synthesizers / DIY Electronics / Accessories",
  "brand": "Manufacturer Name",
  "model": "Model Number or Name",
  "condition": "Excellent",
  "estimatedValue": "$100",
  "notes": "Notable features, color, or visible text"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        const itemData = JSON.parse(rawText);
        itemData.id = Date.now();
        itemData.date = new Date().toLocaleDateString();

        inventory.unshift(itemData);
        saveInventory();
        renderInventory();
        showStatus(`Identified: ${itemData.name}`, 'success');

      } catch (err) {
        showStatus('Identification failed. Check API key or image clarity.', 'error');
        console.error(err);
      }
    }

    function saveInventory() {
      localStorage.setItem('gear_inventory', JSON.stringify(inventory));
    }

    function deleteItem(id) {
      inventory = inventory.filter(i => i.id !== id);
      saveInventory();
      renderInventory();
    }

    function renderInventory() {
      const container = document.getElementById('inventoryContainer');
      container.innerHTML = '';

      let totalVal = 0;

      if (inventory.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-6 text-sm">No gear scanned yet.</p>`;
      } else {
        inventory.forEach(item => {
          const numVal = parseFloat((item.estimatedValue || '').replace(/[^0-9.]/g, '')) || 0;
          totalVal += numVal;

          container.innerHTML += `
            <div class="glass p-4 rounded-xl flex justify-between items-start border-l-4 border-indigo-500">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-slate-100">${item.name || 'Unknown Item'}</h3>
                  <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded-full">${item.category || 'Gear'}</span>
                </div>
                <p class="text-xs text-slate-400">Brand: <span class="text-slate-200">${item.brand || 'N/A'}</span> | Model: <span class="text-slate-200">${item.model || 'N/A'}</span></p>
                <p class="text-xs text-slate-400">Condition: <span class="text-slate-200">${item.condition || 'N/A'}</span> | Est. Value: <span class="text-emerald-400 font-medium">${item.estimatedValue || '$0'}</span></p>
                ${item.notes ? `<p class="text-xs text-slate-400 italic">"${item.notes}"</p>` : ''}
              </div>
              <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-rose-400 p-1">
                <i class="fa-solid fa-trash text-sm"></i>
              </button>
            </div>
          `;
        });
      }

      document.getElementById('totalCount').innerText = inventory.length;
      document.getElementById('totalValue').innerText = `$${totalVal.toLocaleString()}`;
    }

    function showStatus(msg, type) {
      const el = document.getElementById('statusMessage');
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    function exportCSV() {
      if (inventory.length === 0) return alert('Inventory is empty.');
      const headers = ['Name', 'Category', 'Brand', 'Model', 'Condition', 'Estimated Value', 'Notes', 'Date Added'];
      const rows = inventory.map(i => [
        `"${i.name || ''}"`,
        `"${i.category || ''}"`,
        `"${i.brand || ''}"`,
        `"${i.model || ''}"`,
        `"${i.condition || ''}"`,
        `"${i.estimatedValue || ''}"`,
        `"${i.notes || ''}"`,
        `"${i.date || ''}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `music_gear_inventory_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openManualAddModal() {
      const name = prompt('Gear Name / Title:');
      if (!name) return;
      const brand = prompt('Brand/Manufacturer:');
      const val = prompt('Estimated Value ($):');

      inventory.unshift({
        id: Date.now(),
        name,
        brand,
        category: 'Manual Entry',
        estimatedValue: val ? `$${val}` : '$0',
        date: new Date().toLocaleDateString()
      });
      saveInventory();
      renderInventory();
    }
  </script>
</body>
</html>
